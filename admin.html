<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المالك — ASH</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/"><span class="logo">ASH</span><span class="tagline">لوحة تحكم المالك</span></a><a class="outline" href="/">عرض المتجر</a></header><main class="admin-wrap"><section id="loginBox" class="admin-card"><h2>دخول المالك</h2><p class="muted">كلمة المرور تضبطينها في متغير OWNER_PASSWORD داخل Railway.</p><form id="loginForm"><input class="admin-input" name="password" type="password" required placeholder="كلمة مرور المالك"><div class="admin-actions"><button class="btn dark">دخول</button></div></form><div id="loginMsg"></div></section><div id="dashboard" class="hidden"><div class="admin-head"><h1>لوحة التحكم</h1><button id="logout" class="btn">تسجيل الخروج</button></div><section class="admin-card"><h2>معلومات المحل</h2><form id="settingsForm"><div class="admin-grid" id="settingsFields"></div><div class="admin-actions"><button class="btn dark">حفظ الإعدادات</button></div></form><div id="settingsMsg"></div></section><section class="admin-card"><h2>إضافة صنف</h2><form id="newProduct"><div class="admin-grid"><label>اسم الصنف<input class="admin-input" name="name" required></label><label>القسم<input class="admin-input" name="category" required placeholder="القهوة الباردة"></label><label>السعر بالريال<input class="admin-input" name="price" type="number" min="0" step="0.5" required></label><label>رابط الصورة<input class="admin-input" name="image_url" type="url" placeholder="https://..."></label><label>الوصف<input class="admin-input" name="description"></label><label>ترتيب العرض<input class="admin-input" name="sort_order" type="number" value="0"></label></div><div class="admin-actions"><button class="btn dark">إضافة الصنف</button></div></form><div id="productMsg"></div></section><section class="admin-card"><h2>إدارة الأصناف</h2><div id="productsAdmin"></div></section><section class="admin-card"><div class="admin-head"><h2>الطلبات</h2><button class="btn" id="refreshOrders">تحديث</button></div><div id="ordersAdmin"></div></section></div></main><script src="/admin.js"></script></body></html>
